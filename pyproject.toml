[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
# Distribution name; the import package and CLI are both `ferry` (PyPI's
# `ferry` is an unrelated project).
name = "ferry-ingest"
version = "0.1.0a1"
description = "Edge agent that ships instrument data from watched folders to S3-compatible object storage on a cron schedule or as it lands, with a local journal and pluggable catalog registrars"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ferry contributors" }]
keywords = [
    "s3",
    "ceph",
    "object-storage",
    "ingest",
    "lab-instruments",
    "file-watcher",
    "edge",
    "data-catalog",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Archiving :: Mirroring",
    "Typing :: Typed",
]
dependencies = [
    "obstore>=0.8",
    "watchfiles>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.13",
    "cronsim>=2.6",
    # zoneinfo has no system time zone database to read on Windows.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# AWS shared-config profiles (`profile:` on a store), through obstore's boto3
# credential provider. Static keys and environment credentials need nothing.
aws = ["boto3>=1.34"]

[project.scripts]
ferry = "ferry.cli:main"

[project.entry-points."ferry.registrars"]
manifest = "ferry.registrars.manifest:ManifestRegistrar"
null = "ferry.registrars.base:NullRegistrar"

[project.entry-points."ferry.notifiers"]
webhook = "ferry.notify:WebhookNotifier"

[project.urls]
Repository = "https://github.com/elyall/ferry"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "moto[server]>=5",  # in-process S3 endpoint for the integration tests
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "ferry"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiom requires calling Option()/Argument() in parameter defaults.
"src/ferry/cli.py" = ["B008"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["ferry"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]
