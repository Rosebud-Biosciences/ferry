# Packages the `ferry` binary as a wheel, so `pip install ferry-ingest` (or
# `uv tool install ferry-ingest`) puts it on PATH with no Rust toolchain. The
# version comes from Cargo.toml.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ferry-ingest"
description = "Edge agent that ships instrument data from watched folders to one or more S3-compatible stores, on a cron schedule or as it lands"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["s3", "ceph", "object-storage", "ingest", "lab-instruments", "file-watcher", "edge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Archiving :: Mirroring",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/Rosebud-Biosciences/ferry"

[tool.maturin]
bindings = "bin"
