name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release runs it first

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        # Windows has its own code paths (the service, the open-file probe).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is where most instrument PCs are: its file events, locking
        # and paths are what the agent has to get right.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-fail-fast

  msrv:
    # The declared rust-version builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  s3-seaweedfs:
    # The S3 tests, against an S3 implementation that -- like Ceph RGW -- is
    # reached path-style at a custom endpoint.
    runs-on: ubuntu-latest
    env:
      FERRY_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      FERRY_TEST_S3_KEY: ferry
      FERRY_TEST_S3_SECRET: ferry-secret
      FERRY_TEST_S3_BUCKET: ferry-test
    steps:
      - uses: actions/checkout@v7
      - name: Start SeaweedFS
        run: |
          set -euo pipefail
          mkdir -p /tmp/seaweedfs
          printf '{"identities":[{"name":"ferry","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
            "$FERRY_TEST_S3_KEY" "$FERRY_TEST_S3_SECRET" > /tmp/seaweedfs/s3.json
          docker run -d --name seaweedfs -p 8333:8333 \
            -v /tmp/seaweedfs:/etc/seaweedfs:ro chrislusf/seaweedfs:4.47 \
            server -ip.bind=0.0.0.0 -dir=/data -master.volumeSizeLimitMB=256 \
            -volume.max=0 -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:8333/status >/dev/null; then
              AWS_ACCESS_KEY_ID="$FERRY_TEST_S3_KEY" AWS_SECRET_ACCESS_KEY="$FERRY_TEST_S3_SECRET" \
                AWS_DEFAULT_REGION=us-east-1 \
                aws --endpoint-url "$FERRY_TEST_S3_ENDPOINT" s3 mb "s3://$FERRY_TEST_S3_BUCKET"
              exit 0
            fi
            sleep 1
          done
          docker logs seaweedfs
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test s3 -- --include-ignored

  wheel:
    # The PyPI packaging builds and its binary runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist
          manylinux: auto
      - run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/ferry --version
      - name: The release unpacks it into a standalone binary
        run: |
          mkdir -p wheels/wheel-x86_64-unknown-linux-gnu
          cp dist/*.whl wheels/wheel-x86_64-unknown-linux-gnu/
          python3 .github/scripts/package_binaries.py 0.0.0-test wheels binaries
          tar -xzf binaries/ferry-0.0.0-test-x86_64-unknown-linux-gnu.tar.gz
          ferry-0.0.0-test-x86_64-unknown-linux-gnu/ferry --version
