name: Bug report
description: ferry did something it should not have, or did not do what it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security problem? Report it privately instead: see SECURITY.md.
        Remove credentials and webhook URLs from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what ferry did, and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `ferry --version`.
      placeholder: ferry 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The OS, and where the watched folder and the store are (local disk, network share, Ceph RGW, AWS S3, ...).
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Config
      description: The relevant part of your config, redacted.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs and status
      description: The relevant lines from `<state_dir>/logs/ferry.*.jsonl`, and the output of `ferry status --units` and `ferry doctor`.
      render: text
